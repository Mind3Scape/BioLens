<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Знак BioLens: линза, сквозь которую видно живое.
       Кольцо — сама линза, волна внутри — пульс. Ничего лишнего:
       на 60 пикселях рабочего стола читается и то, и другое. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2F38"/>
      <stop offset="1" stop-color="#0C0D11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="62%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M170 256h30l24-52 34 106 24-54h60" fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
